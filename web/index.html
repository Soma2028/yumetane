<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ホーム画面に追加できるようにする。iOSのSafariは、7日間操作の無いサイトの
         localStorageを消す（https://webkit.org/tracking-prevention/）が、ホーム画面に
         追加したWebアプリはその対象外のため、記録を守る手段として使う -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fbf8f3" />
    <meta name="apple-mobile-web-app-title" content="夢のタネ" />
    <!-- apple-mobile-web-app-status-bar-style は付けない。"default"だとホーム画面から開いたとき
         ステータスバーが白い帯になり、クリーム色の背景から浮いて見えたため、指定を外して
         theme-colorが使われるかを試している -->
    <title>夢のタネ — 今日の勉強が、まだ知らない仕事との出会いになる</title>
    <meta name="description" content="勉強した教科を記録すると、その教科をよく使う仕事がひとつ見つかる。中学生のための、学習記録と職業図鑑のアプリ。" />

    <!-- リンク共有時のカード（LINE・Slack・X等）。og:imageは絶対URLが必要。
         画像はLPのPC版ファーストビューを1200x630で撮影したもの -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="夢のタネ" />
    <meta property="og:title" content="夢のタネ — 今日の勉強が、まだ知らない仕事との出会いになる" />
    <meta property="og:description" content="勉強した教科を記録すると、その教科をよく使う仕事がひとつ見つかる。中学生のための、学習記録と職業図鑑のアプリ。" />
    <meta property="og:url" content="https://web-soma2028.vercel.app/" />
    <meta property="og:image" content="https://web-soma2028.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="夢のタネのファーストビュー。数学を30分記録すると、精密機器技術者という仕事が見つかる例" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
